<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHI Insurance Portal — Σύνδεση</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
body {
  background: linear-gradient(135deg, #0F1A3A 0%, #1B2B5E 60%, #2E4BA3 100%);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  font-family: 'Segoe UI', system-ui, sans-serif;
}
.login-card {
  background: white; border-radius: 20px; padding: 44px 40px;
  width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.logo-chi { font-size: 36px; font-weight: 900; color: #1B2B5E; letter-spacing: 4px; }
.logo-tagline { font-size: 11px; color: #64748B; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 30px; }
.form-control {
  border: 1.5px solid #E2E8F0; border-radius: 10px; padding: 11px 14px;
  font-size: 14px; transition: border-color 0.15s;
}
.form-control:focus { border-color: #2E4BA3; box-shadow: 0 0 0 3px rgba(46,75,163,0.12); }
.btn-login {
  background: linear-gradient(135deg, #1B2B5E, #2E4BA3);
  color: white; border: none; border-radius: 10px; padding: 12px;
  font-size: 15px; font-weight: 600; width: 100%; cursor: pointer;
  transition: opacity 0.15s;
}
.btn-login:hover { opacity: 0.9; color: white; }
.hal-badge {
  background: linear-gradient(135deg, #C9A96E, #B8934F);
  color: #1C1410; font-size: 10px; font-weight: 700; letter-spacing: 1px;
  padding: 3px 10px; border-radius: 20px;
}
.portal-info { font-size: 11.5px; color: #94A3B8; margin-top: 24px; text-align: center; line-height: 1.8; }
</style>
</head>
<body>
<div class="login-card">
  <div class="text-center mb-4">
    <div class="logo-chi">CHI</div>
    <div class="logo-tagline">Insurance Brokers</div>
    <span class="hal-badge"><i class="fas fa-robot me-1"></i>HAL AI Powered</span>
  </div>

  {% for cat, msg in get_flashed_messages(with_categories=True) %}
  <div class="alert alert-{{ 'danger' if cat=='danger' else 'warning' }} py-2 mb-3" style="border-radius:8px;font-size:13px">{{ msg }}</div>
  {% endfor %}

  <form method="POST">
    <div class="mb-3">
      <label class="form-label fw-semibold" style="font-size:13px;color:#374151">Email</label>
      <input type="email" name="email" class="form-control" placeholder="your@email.com" required autofocus>
    </div>
    <div class="mb-4">
      <label class="form-label fw-semibold" style="font-size:13px;color:#374151">Κωδικός</label>
      <div class="position-relative">
        <input type="password" name="password" id="loginPw" class="form-control" placeholder="••••••••" required style="padding-right:44px">
        <button type="button" onclick="toggleLoginPw()" class="btn position-absolute" style="right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:#94A3B8;padding:4px 8px" tabindex="-1">
          <i class="fas fa-eye" id="loginEyeIcon"></i>
        </button>
      </div>
    </div>
    <div class="text-end mb-2" style="margin-top:-8px">
      <a href="/forgot-password" style="font-size:12px;color:#64748B;text-decoration:none">Ξέχασες τον κωδικό;</a>
    </div>
    <button type="submit" class="btn-login">
      <i class="fas fa-sign-in-alt me-2"></i>Σύνδεση
    </button>
  </form>

  <div class="portal-info">
    <strong style="color:#1B2B5E">CHI Insurance Portal v2</strong><br>
    Agent · Client · Back Office<br>
    <span style="color:#C9A96E">info@chiinsurancebrokers.com</span>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function toggleLoginPw() {
  const inp = document.getElementById('loginPw');
  const icon = document.getElementById('loginEyeIcon');
  if (inp.type === 'password') {
    inp.type = 'text';
    icon.className = 'fas fa-eye-slash';
  } else {
    inp.type = 'password';
    icon.className = 'fas fa-eye';
  }
}
</script>
</body>
</html>
