<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Νέος Κωδικός — CHI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:linear-gradient(135deg,#0F1A3A 0%,#1B2B5E 60%,#2E4BA3 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',sans-serif;padding:20px}
.card{background:white;border-radius:20px;padding:36px 32px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.logo-chi{font-size:30px;font-weight:900;color:#1B2B5E;letter-spacing:4px}
.logo-sub{font-size:10px;color:#64748B;letter-spacing:2px;text-transform:uppercase}
.form-control{border:1.5px solid #E2E8F0;border-radius:10px;padding:11px 14px;font-size:14px}
.form-control:focus{border-color:#2E4BA3;box-shadow:0 0 0 3px rgba(46,75,163,0.12)}
.btn-main{background:linear-gradient(135deg,#1B2B5E,#2E4BA3);color:white;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:600;width:100%}
.req{font-size:11.5px;color:#94A3B8;margin-top:3px}
.req.ok{color:#16A34A}
</style>
</head>
<body>
<div class="card">
  <div class="text-center mb-4">
    <div class="logo-chi">CHI</div>
    <div class="logo-sub">Insurance Brokers</div>
  </div>
  {% if error and not token %}
  <div class="text-center">
    <div style="font-size:48px;margin-bottom:12px">⚠️</div>
    <h5 style="color:#DC2626;font-weight:700;margin-bottom:10px">Μη έγκυρος σύνδεσμος</h5>
    <p style="color:#374151;font-size:13.5px">{{ error }}</p>
    <a href="{{ url_for('forgot_password') }}" class="btn-main d-block mt-4" style="text-decoration:none;text-align:center;padding:12px">Ζητήστε νέο σύνδεσμο</a>
  </div>
  {% else %}
  <h5 style="color:#1B2B5E;font-weight:700;margin-bottom:6px">🔐 Νέος Κωδικός</h5>
  <p style="color:#64748B;font-size:13px;margin-bottom:20px">Δημιουργήστε τον νέο σας κωδικό πρόσβασης.</p>
  {% if error %}
  <div class="alert alert-danger py-2 mb-3" style="border-radius:8px;font-size:13px">{{ error }}</div>
  {% endif %}
  <form method="POST">
    <div class="mb-3">
      <label class="form-label fw-semibold" style="font-size:13px">Νέος Κωδικός</label>
      <div class="position-relative">
        <input type="password" name="new_password" id="newPw" class="form-control" required placeholder="Τουλάχιστον 8 χαρακτήρες" oninput="checkStrength(this.value)">
        <button type="button" onclick="togglePw('newPw',this)" class="btn btn-sm position-absolute" style="right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:#94A3B8">👁</button>
      </div>
      <div id="req1" class="req">✗ Τουλάχιστον 8 χαρακτήρες</div>
      <div id="req2" class="req">✗ Κεφαλαίο γράμμα</div>
      <div id="req3" class="req">✗ Αριθμός ή σύμβολο</div>
    </div>
    <div class="mb-4">
      <label class="form-label fw-semibold" style="font-size:13px">Επιβεβαίωση</label>
      <input type="password" name="confirm_password" id="confirmPw" class="form-control" required placeholder="Επανάληψη" oninput="checkMatch()">
      <div id="matchMsg" class="req"></div>
    </div>
    <button type="submit" class="btn-main">💾 Αποθήκευση Κωδικού</button>
  </form>
  {% endif %}
</div>
<script>
function togglePw(id,btn){const i=document.getElementById(id);i.type=i.type==='password'?'text':'password';btn.textContent=i.type==='password'?'👁':'🙈'}
function checkStrength(pw){
  const r1=pw.length>=8,r2=/[A-Z]/.test(pw),r3=/[0-9!@#$%^&*]/.test(pw);
  ['req1','req2','req3'].forEach((id,i)=>{
    const el=document.getElementById(id);
    const v=[r1,r2,r3][i];
    const txt=['Τουλάχιστον 8 χαρακτήρες','Κεφαλαίο γράμμα','Αριθμός ή σύμβολο'][i];
    el.className='req'+(v?' ok':'');el.textContent=(v?'✓':'✗')+' '+txt;
  });
}
function checkMatch(){
  const msg=document.getElementById('matchMsg');
  const np=document.getElementById('newPw').value;
  const cp=document.getElementById('confirmPw').value;
  if(!cp.length){msg.textContent='';return}
  if(np===cp){msg.textContent='✓ Ταιριάζουν';msg.style.color='#16A34A'}
  else{msg.textContent='✗ Δεν ταιριάζουν';msg.style.color='#DC2626'}
}
</script>
</body>
</html>
